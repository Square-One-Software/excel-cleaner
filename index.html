<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Excel Clener</title>
</head>
<body>
    <div class="main">
        <h1>Excel Cleaner</h1>
        <div class="upload-bar">
            <label for="file-uploader" class="upload-bar__face">
                <span class="upload-bar__text" id="file-name">Choose an Excel file</span>
            </label>
            <input type="file" accept=".xls, .xlsm, .xlsx" id="file-uploader" class="upload-bar__input">
        </div>
        <div class="actions">
            <button type="button" class="btn" id="btn-choose">Choose file</button>
            <button type="button" class="btn" onclick="window.print()">Print</button>
        </div>
    </div>
   
    <div class="tab-container hidden" id="tab-area">
        <div class="tabs" id="tab-btn-area">
        </div>
    </div>
    <script type="text/javascript" src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script type="text/javascript" src="app.js"></script> 
</body>
</html>
